; X4 Classic (X4C) — minimal diagnostic firmware
;
; Mirrors the verified [base] + [env:x4c] from FreeInk SDK
; platformio.sample.ini (pinned submodule: freeink-sdk).
; pioarduino 55.03.37 = Arduino-ESP32 3.3.7 / ESP-IDF 5.5.x — the combo
; verified by the SDK. Pin it by version, never by moving branch.

[platformio]
default_envs = x4c

[base]
; https://github.com/pioarduino/platform-espressif32 (Arduino core 3.3.x / ESP-IDF 5.5.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Injects -DFIRMWARE_VERSION (git describe) and -DFREEINK_SDK_SHA at compile time.
extra_scripts = pre:scripts/build_version.py

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

build_unflags =
  -std=gnu++11

; The Xteink X4 module is wired for DIO / 16 MB (esptool-confirmed).
board_build.flash_mode = dio
board_build.flash_size = 16MB

; FreeInk SDK libraries used by this diagnostic firmware.
; Only BoardConfig is needed: it supplies the X4C board profile (pins, I2C bus,
; RTC address) from BoardConfig::ACTIVE. Display/input/SD/RTC-driver libraries
; are intentionally NOT linked — the diagnostic firmware must not initialize
; the display or write RTC registers (see README.md).
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig

[env:x4c]
extends = base
board = esp32-s3-devkitc1-n16r8  ; 16 MB flash + 8 MB PSRAM
board_build.mcu = esp32s3
build_flags =
  ${base.build_flags}
  -DBOARD_HAS_PSRAM
  ; SD is 1-bit SDMMC (FREEINK_SD_SDMMC auto-enables); SdFat needs its generic
  ; block-device interface. Kept from the SDK's verified x4c env even though no
  ; SD library is linked in this diagnostic build.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_DEVICE_X4CLASSIC=1
